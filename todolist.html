<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Index</title>
</head>
<body>
    <h1><a href="todolist.html">1. To Do List</a></h1>

    <input type="text" 
        id="taskInput"  <!-- FIXED -->
        placeholder="Add a task" />

    <button onclick="addTask()">Add</button> <!-- FIXED -->

    <script>
        function addTask() {
            const { text, input } = getTaskText();
            console.log("Task added:", text); // Optional, to confirm task
        }

        function getTaskText() {
            const input = document.getElementById('taskInput');
            const text = input.value.trim();

            console.log("getTaskText() called: " + input.value);
            return { text, input }; // FIXED formatting
        }
    </script>
</body>
</html>
