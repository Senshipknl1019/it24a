<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Maps</title>
    
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    
    <style>
      #map {
        height: 400px;
      }
    </style>
</head>
<body>
    <h1>Basic Maps</h1>
    <div id="map"></div>
    
    <script>
      var map = L.map('map').setView([8.361262056175674, 124.86600408905558], 13);

      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
      }).addTo(map);

      var marker = L.marker([8.361262056175674, 124.86600408905558]).addTo(map);

      const dogimage = '<img src="https://www.boredpanda.com/blog/wp-content/uploads/2023/03/famous-cartoon-dogs-45-6401a896c941f__700.jpg" alt="Dog Image" style="width:150px;">';

      const popupcontent = "<b>Hello world!</b><br>I am a popup.<br>" + dogimage;

      marker.bindPopup(popupcontent).openPopup();
    </script>
</body>
</html>
